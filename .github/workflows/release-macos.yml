name: Build and release JARVIS Companion

on:
  push:
    branches: [main]
    paths:
      - 'apps/companion/**'
      - '.github/workflows/release-macos.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jarvis-companion-release
  cancel-in-progress: false

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: macos-26-intel
          - arch: arm64
            os: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Apple signing secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing Apple release secrets: ${missing[*]}. See apps/companion/README.md#signed-release-setup."
            exit 1
          fi

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/companion/package-lock.json

      - name: Install
        working-directory: apps/companion
        run: npm ci

      - name: Test
        working-directory: apps/companion
        run: npm test

      - name: Build, sign, and notarize
        working-directory: apps/companion
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm run assets
          npx electron-builder --mac --${{ matrix.arch }} --publish never --config.mac.notarize=true --config.forceCodeSigning=true

      - name: Verify signature and notarization
        working-directory: apps/companion
        run: |
          app="$(find release -maxdepth 2 -type d -name 'JARVIS.app' -print -quit)"
          if [ -z "$app" ]; then
            echo "::error::JARVIS.app was not produced."
            exit 1
          fi
          echo "Verifying $app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-companion-${{ matrix.arch }}
          path: |
            apps/companion/release/*.dmg
            apps/companion/release/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download both architectures
        uses: actions/download-artifact@v4
        with:
          pattern: jarvis-companion-*
          path: artifacts
          merge-multiple: true

      - name: Read version
        id: version
        working-directory: apps/companion
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: companion-v${{ steps.version.outputs.version }}
          name: JARVIS Companion v${{ steps.version.outputs.version }}
          body: |
            Always-there macOS companion for JARVIS.

            **Requires** the JARVIS daemon on the same machine (default
            `http://127.0.0.1:8765`). Run `jarvis serve` first.

            Signed with a Developer ID Application certificate and notarized
            by Apple. Gatekeeper verifies the stapled ticket on first launch.

            Intel and Apple silicon DMGs/ZIPs are attached below.
          files: |
            artifacts/*.dmg
            artifacts/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
