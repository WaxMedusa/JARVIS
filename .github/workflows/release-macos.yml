name: Build and release JARVIS Companion

on:
  push:
    branches: [main]
    paths:
      - 'apps/companion/**'
      - '.github/workflows/release-macos.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jarvis-companion-release
  cancel-in-progress: false

jobs:
  signing:
    name: Check Apple signing credentials
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Detect credentials
        id: check
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          available=true
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              available=false
            fi
          done
          echo "available=${available}" >> "$GITHUB_OUTPUT"
          if [ "$available" = "true" ]; then
            echo "Apple signing credentials detected; this run will produce a signed and notarized release."
          else
            echo "::notice::Apple signing credentials are not configured. This run will publish an unsigned preview release so the companion remains installable; add the five secrets for a signed release."
          fi

  build:
    name: macOS ${{ matrix.arch }}
    needs: signing
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: macos-26-intel
          - arch: arm64
            os: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/companion/package-lock.json

      - name: Install
        working-directory: apps/companion
        run: npm ci

      - name: Test
        working-directory: apps/companion
        run: npm test

      - name: Build signed and notarized
        if: needs.signing.outputs.available == 'true'
        working-directory: apps/companion
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm run assets
          npx electron-builder --mac --${{ matrix.arch }} --publish never --config.mac.notarize=true --config.forceCodeSigning=true

      - name: Build unsigned preview
        if: needs.signing.outputs.available != 'true'
        working-directory: apps/companion
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run assets
          npx electron-builder --mac --${{ matrix.arch }} --publish never

      - name: Verify packaged app and disk image
        working-directory: apps/companion
        shell: bash
        run: |
          set -euo pipefail
          app="$(find release -maxdepth 2 -type d -name 'JARVIS.app' -print -quit)"
          if [ -z "$app" ]; then
            echo "::error::JARVIS.app was not produced."
            exit 1
          fi
          test -f "$app/Contents/Resources/app.asar"
          plutil -lint "$app/Contents/Info.plist"
          plutil -extract CFBundleIdentifier raw -o - "$app/Contents/Info.plist"
          plutil -extract NSMicrophoneUsageDescription raw -o - "$app/Contents/Info.plist"
          plutil -extract LSUIElement raw -o - "$app/Contents/Info.plist"
          dmg="$(find release -maxdepth 1 -name '*.dmg' -print -quit)"
          zip="$(find release -maxdepth 1 -name '*.zip' -print -quit)"
          test -n "$dmg"
          test -n "$zip"
          hdiutil verify "$dmg"
          unzip -tq "$zip"
          echo "Verified JARVIS.app, $(basename "$dmg"), and $(basename "$zip") for ${{ matrix.arch }}."

      - name: Verify Developer ID signature and notarization
        if: needs.signing.outputs.available == 'true'
        working-directory: apps/companion
        shell: bash
        run: |
          set -euo pipefail
          app="$(find release -maxdepth 2 -type d -name 'JARVIS.app' -print -quit)"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-companion-${{ matrix.arch }}
          path: |
            apps/companion/release/*.dmg
            apps/companion/release/*.zip
          if-no-files-found: error
          retention-days: 7

  release-signed:
    name: Publish signed release
    needs: [signing, build]
    if: needs.signing.outputs.available == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download both architectures
        uses: actions/download-artifact@v4
        with:
          pattern: jarvis-companion-*
          path: artifacts
          merge-multiple: true

      - name: Read version
        id: version
        working-directory: apps/companion
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Publish signed GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: companion-v${{ steps.version.outputs.version }}
          name: JARVIS Companion v${{ steps.version.outputs.version }}
          body: |
            Always-there macOS companion for JARVIS, with Chat, Notes, Agenda and voice capture.

            **Requires** the JARVIS daemon on the same machine (default
            `http://127.0.0.1:8765`). Run `jarvis serve` first.

            Signed with a Developer ID Application certificate and notarized
            by Apple. Gatekeeper verifies the stapled ticket on first launch.

            Intel and Apple silicon DMGs/ZIPs are attached below.
          files: |
            artifacts/*.dmg
            artifacts/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true

  release-unsigned:
    name: Publish unsigned preview release
    needs: [signing, build]
    if: needs.signing.outputs.available != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download both architectures
        uses: actions/download-artifact@v4
        with:
          pattern: jarvis-companion-*
          path: artifacts
          merge-multiple: true

      - name: Read version
        id: version
        working-directory: apps/companion
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Publish unsigned preview GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: companion-v${{ steps.version.outputs.version }}-unsigned
          name: JARVIS Companion v${{ steps.version.outputs.version }} (unsigned preview)
          prerelease: true
          body: |
            Always-there macOS companion for JARVIS, with Chat, Notes, Agenda and voice capture.

            **Requires** the JARVIS daemon on the same machine (default
            `http://127.0.0.1:8765`). Run `jarvis serve` first.

            **This is an unsigned preview build.** It was produced because the
            repository's Apple signing secrets are not configured. macOS may
            block it on first launch. If you trust this repository, right-click
            JARVIS in Applications and choose Open, or remove the quarantine
            attribute:

            ```bash
            xattr -dr com.apple.quarantine /Applications/JARVIS.app
            ```

            Do not do that for a build whose source you do not trust. For a
            signed and notarized release, configure the five Apple secrets and
            merge to `main` again.

            Intel and Apple silicon DMGs/ZIPs are attached below.
          files: |
            artifacts/*.dmg
            artifacts/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
