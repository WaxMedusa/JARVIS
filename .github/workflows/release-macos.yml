name: Build and release JARVIS

on:
  push:
    branches: [main]
    paths:
      - 'apps/companion/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/release-macos.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jarvis-companion-release
  cancel-in-progress: false

jobs:
  signing:
    name: Check Apple signing credentials
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Detect credentials
        id: check
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          available=true
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              available=false
            fi
          done
          echo "available=${available}" >> "$GITHUB_OUTPUT"
          if [ "$available" = "true" ]; then
            echo "Apple signing credentials detected; this run will produce a signed and notarized release."
          else
            echo "::notice::Apple signing credentials are not configured. This run will publish an unsigned preview release so the app remains installable; add the five secrets for a signed release."
          fi

  build:
    name: macOS ${{ matrix.arch }}
    needs: signing
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: macos-26-intel
          - arch: arm64
            os: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/companion/package-lock.json

      - name: Install core
        run: npm ci

      - name: Typecheck and build core
        run: |
          npm run typecheck
          npm run build

      - name: Test core
        if: matrix.arch == 'arm64'
        run: npm test

      - name: Install companion
        working-directory: apps/companion
        run: npm ci

      - name: Test companion
        working-directory: apps/companion
        run: npm test

      - name: Bundle embedded core
        working-directory: apps/companion
        run: npm run prepare:backend

      - name: Verify embedded core
        working-directory: apps/companion
        run: |
          set -euo pipefail
          test -s extraResources/backend/index.cjs
          test -f extraResources/backend/package.json
          node extraResources/backend/index.cjs --help > /dev/null
          echo "Embedded core: $(du -h extraResources/backend/index.cjs | cut -f1)"

      - name: Build signed and notarized
        if: needs.signing.outputs.available == 'true'
        working-directory: apps/companion
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm run assets
          npx electron-builder --mac --${{ matrix.arch }} --publish never --config.mac.notarize=true --config.forceCodeSigning=true

      - name: Build unsigned preview
        if: needs.signing.outputs.available != 'true'
        working-directory: apps/companion
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run assets
          npx electron-builder --mac --${{ matrix.arch }} --publish never

      - name: Verify packaged app, core and disk image
        working-directory: apps/companion
        shell: bash
        run: |
          set -euo pipefail
          app="$(find release -maxdepth 2 -type d -name 'JARVIS.app' -print -quit)"
          if [ -z "$app" ]; then
            echo "::error::JARVIS.app was not produced."
            exit 1
          fi
          test -f "$app/Contents/Resources/app.asar"
          test -s "$app/Contents/Resources/backend/index.cjs"
          test -f "$app/Contents/Resources/backend/package.json"
          plutil -lint "$app/Contents/Info.plist"
          plutil -extract CFBundleIdentifier raw -o - "$app/Contents/Info.plist"
          plutil -extract NSMicrophoneUsageDescription raw -o - "$app/Contents/Info.plist"
          version="$(plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist")"
          test "$version" = "3.0.0"
          lui="$(plutil -extract LSUIElement raw -o - "$app/Contents/Info.plist")"
          case "$lui" in 0|false) ;; *) echo "::error::LSUIElement must be false, got $lui"; exit 1;; esac
          ./node_modules/.bin/asar list "$app/Contents/Resources/app.asar" | grep -q '/workspace.js'
          ./node_modules/.bin/asar list "$app/Contents/Resources/app.asar" | grep -q '/styles-v3.css'
          ./node_modules/.bin/asar list "$app/Contents/Resources/app.asar" | grep -q '/markdown.js'
          echo "Checking that the installed app can start its own core with no terminal…"
          home="$(mktemp -d)"
          port=8791
          JARVIS_HOME="$home" \
          JARVIS_LLM_PROVIDER=mock \
          JARVIS_SERVER_HOST=127.0.0.1 \
          JARVIS_SERVER_PORT="$port" \
          JARVIS_API_TOKEN=ci-token \
          JARVIS_PROACTIVE=false \
          JARVIS_EMBEDDINGS=false \
          node "$app/Contents/Resources/backend/index.cjs" serve --host 127.0.0.1 --port "$port" > core-smoke.log 2>&1 &
          core_pid=$!
          cleanup() { kill "$core_pid" 2>/dev/null || true; wait "$core_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ready=false
          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:$port/health" > /dev/null; then
              ready=true
              break
            fi
            sleep 0.5
          done
          if [ "$ready" != "true" ]; then
            echo "::error::The bundled core did not become healthy."
            cat core-smoke.log
            exit 1
          fi
          cleanup
          trap - EXIT
          dmg="$(find release -maxdepth 1 -name '*.dmg' -print -quit)"
          zip="$(find release -maxdepth 1 -name '*.zip' -print -quit)"
          test -n "$dmg"
          test -n "$zip"
          hdiutil verify "$dmg"
          unzip -tq "$zip"
          echo "Verified JARVIS.app, the embedded core, $(basename "$dmg"), and $(basename "$zip") for ${{ matrix.arch }}."

      - name: Verify Developer ID signature and notarization
        if: needs.signing.outputs.available == 'true'
        working-directory: apps/companion
        shell: bash
        run: |
          set -euo pipefail
          app="$(find release -maxdepth 2 -type d -name 'JARVIS.app' -print -quit)"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-companion-${{ matrix.arch }}
          path: |
            apps/companion/release/*.dmg
            apps/companion/release/*.zip
          if-no-files-found: error
          retention-days: 7

  release-signed:
    name: Publish signed release
    needs: [signing, build]
    if: needs.signing.outputs.available == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download both architectures
        uses: actions/download-artifact@v4
        with:
          pattern: jarvis-companion-*
          path: artifacts
          merge-multiple: true

      - name: Read version
        id: version
        working-directory: apps/companion
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Publish signed GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: companion-v${{ steps.version.outputs.version }}
          name: JARVIS v${{ steps.version.outputs.version }}
          body: |
            JARVIS is now one app. The core, memory, tools, browser, Canvas
            client and calendar engine are all inside the download — no
            terminal, no separate daemon, no setup beyond choosing a model.

            **First launch:** drag JARVIS to Applications, open it, pick a
            model, paste your own API key. The key is stored in the macOS
            Keychain and handed only to the private local core.

            Inside: a ChatGPT-grade chat workspace, notes, voice notes, an
            embedded browser JARVIS can read, Google Calendar/iCloud/Outlook
            via private iCal feeds, and read-only Canvas LMS with courses,
            assignments and due dates.

            Signed with a Developer ID Application certificate and notarized
            by Apple. Intel and Apple silicon DMGs/ZIPs are attached below.
          files: |
            artifacts/*.dmg
            artifacts/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true

  release-unsigned:
    name: Publish unsigned preview release
    needs: [signing, build]
    if: needs.signing.outputs.available != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download both architectures
        uses: actions/download-artifact@v4
        with:
          pattern: jarvis-companion-*
          path: artifacts
          merge-multiple: true

      - name: Read version
        id: version
        working-directory: apps/companion
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Publish unsigned preview GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: companion-v${{ steps.version.outputs.version }}-unsigned
          name: JARVIS v${{ steps.version.outputs.version }} (unsigned preview)
          prerelease: true
          body: |
            JARVIS is now one app. The core, memory, tools, browser, Canvas
            client and calendar engine are all inside the download — no
            terminal, no separate daemon, no setup beyond choosing a model.

            **First launch:** drag JARVIS to Applications, open it, pick a
            model, paste your own API key. The key is stored in the macOS
            Keychain and handed only to the private local core.

            Inside: a ChatGPT-grade chat workspace, notes, voice notes, an
            embedded browser JARVIS can read, Google Calendar/iCloud/Outlook
            via private iCal feeds, and read-only Canvas LMS with courses,
            assignments and due dates.

            **This is an unsigned preview build.** macOS may block it on first
            launch. If you trust this repository, right-click JARVIS in
            Applications and choose Open, or remove the quarantine attribute:

            ```bash
            xattr -dr com.apple.quarantine /Applications/JARVIS.app
            ```

            Do not do that for a build whose source you do not trust. For a
            signed and notarized release, configure the five Apple secrets and
            merge to `main` again.

            Intel and Apple silicon DMGs/ZIPs are attached below.
          files: |
            artifacts/*.dmg
            artifacts/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
